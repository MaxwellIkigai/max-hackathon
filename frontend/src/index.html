    <!-- Main Content -->
    <main class="main-content">
      
      <!-- LEFT: Prompt -->
      <section class="panel prompt-panel">
        <div class="panel-header">
          <span class="panel-label">Your Prompt</span>
        </div>
        <div class="panel-content">
          <textarea 
            id="prompt-input" 
            class="prompt-textarea" 
            placeholder="Describe your bank app... e.g. 'Build a wealth bank with navy + gold palette, home loans and savings'"
          ></textarea>
          
          <div class="preset-chips">
            <button class="chip" data-segment="wealth">Wealth Bank (Navy + Gold)</button>
            <button class="chip" data-segment="mass-market">Mass-Market (Green + Blue)</button>
            <button class="chip" data-segment="neobank">Neobank (Purple Gradient)</button>
            <button class="chip" data-segment="kenya">Kenya Transaction Bank</button>
          </div>
          
          <button id="generate-btn" class="generate-btn">Generate App</button>

          <!-- Generation Steps -->
          <div id="gen-steps" class="gen-steps" style="display:none">
            <div class="gen-step" id="step-analyse">
              <span class="step-icon">◎</span>
              <span class="step-label">Analyzing requirements</span>
            </div>
            <div class="gen-step" id="step-tokens">
              <span class="step-icon">◎</span>
              <span class="step-label">Applying design tokens</span>
            </div>
            <div class="gen-step" id="step-build">
              <span class="step-icon">◎</span>
              <span class="step-label">Building components</span>
            </div>
          </div>

          <div class="history-section">
            <div class="history-title">History</div>
            <div id="history-list" class="history-list"></div>
          </div>
        </div>
      </section>

      <!-- CENTER: Code -->
      <section class="panel code-panel">
        <div class="panel-header">
          <span class="panel-label">Generated Code</span>
          <div class="panel-actions">
            <button id="copy-btn" class="panel-btn" title="Copy">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
        <div class="code-loading-indicator" id="code-loading"></div>
        <div class="panel-content">
          <div class="code-block">
            <pre><code id="code-display" class="language-html"><!-- Generated bank app code will appear here --></code></pre>
          </div>
        </div>
      </section>

      <!-- RIGHT: Preview -->
      <section class="panel preview-panel">
        <div class="panel-header" style="width: 100%; max-width: 380px;">
          <span class="panel-label">Live Preview</span>
          <div class="panel-actions">
            <button id="reset-btn" class="panel-btn" title="Reset">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/>
              </svg>
              <span>Reset</span>
            </button>
          </div>
        </div>

          <div class="iphone-notch"></div>
          <div class="iphone-screen">
            <div class="preview-placeholder" id="preview-placeholder">

              </svg>

            </div>

          </div>
        </div>
      </section>

  </style>
</head>

      }
    };

    // ========== UI STATE ==========
    let currentCode = '';
    let history = [];

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      // Preset chips
      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const segment = chip.dataset.segment;
          if (segment && BANK_TEMPLATES[segment]) {
            generateApp(segment);
          }
        });
      });

      // Generate button
      document.getElementById('generate-btn').addEventListener('click', () => {
        const prompt = document.getElementById('prompt-input').value.trim();
        if (!prompt) {
          alert('Please enter a prompt or select a preset');
          return;
        }
        // For custom prompts, default to wealth template
        generateApp('wealth', prompt);
      });

      // Copy button
      document.getElementById('copy-btn').addEventListener('click', () => {
        if (!currentCode) return;
        navigator.clipboard.writeText(currentCode);
        const btn = document.getElementById('copy-btn');
        const span = btn.querySelector('span');
        span.textContent = 'Copied!';
        setTimeout(() => span.textContent = 'Copy', 2000);
      });

      // Reset button
      document.getElementById('reset-btn').addEventListener('click', () => {
        document.getElementById('preview-placeholder').style.display = 'flex';
        document.getElementById('preview-iframe').style.display = 'none';
        document.getElementById('code-display').textContent = '<!-- Your generated app code will appear here -->';
        currentCode = '';
      });
    });

    // ========== GENERATE APP (NO BACKEND) ==========
    function generateApp(segment, customPrompt = '') {
      const template = BANK_TEMPLATES[segment];
      if (!template) return;

      // Show steps
      const steps = document.getElementById('gen-steps');
      steps.style.display = 'block';
      document.getElementById('generate-btn').disabled = true;

      // Step 1: Analyze
      setStepActive('step-analyse');
      setTimeout(() => {
        setStepComplete('step-analyse');
        setStepActive('step-tokens');
        
        // Step 2: Tokens
        setTimeout(() => {
          setStepComplete('step-tokens');
          setStepActive('step-build');
          
          // Step 3: Build (simulate typing)
          setTimeout(() => {
            setStepComplete('step-build');
            currentCode = template.html;
            
            // Animate code typing
            animateCodeTyping(currentCode, () => {
              // Render preview
              renderPreview(currentCode);
              
              // Add to history
              addToHistory(template.name, customPrompt || template.name);
              
              // Reset UI
              steps.style.display = 'none';
              document.getElementById('generate-btn').disabled = false;
            });
          }, 800);
        }, 800);
      }, 800);
    }

    function setStepActive(stepId) {
      const step = document.getElementById(stepId);
      step.classList.add('active');
      step.querySelector('.step-icon').textContent = '◉';
    }

    function setStepComplete(stepId) {
      const step = document.getElementById(stepId);
      step.classList.remove('active');
      step.classList.add('complete');
      step.querySelector('.step-icon').textContent = '✓';
    }

    function animateCodeTyping(code, callback) {
      const codeDisplay = document.getElementById('code-display');
      const loading = document.getElementById('code-loading');
      
      loading.style.display = 'block';
      
      // Simulate line-by-line typing
      const lines = code.split('\n');
      let currentLine = 0;
      let displayedCode = '';
      
      const interval = setInterval(() => {
        if (currentLine < lines.length) {
          displayedCode += lines[currentLine] + '\n';
          codeDisplay.textContent = displayedCode;
          hljs.highlightElement(codeDisplay);
          currentLine++;
          
          // Auto-scroll code panel
          const codePanel = document.querySelector('.code-panel .panel-content');
          codePanel.scrollTop = codePanel.scrollHeight;
        } else {
          clearInterval(interval);
          loading.style.display = 'none';
          callback();
        }
      }, 15); // 15ms per line for smooth typing
    }

    function renderPreview(html) {
      const iframe = document.getElementById('preview-iframe');
      const placeholder = document.getElementById('preview-placeholder');
      
      iframe.srcdoc = html;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
    }

    function addToHistory(name, prompt) {
      history.unshift({ name, prompt, timestamp: new Date() });
      renderHistory();
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      if (history.length === 0) {
        historyList.innerHTML = '<div style="opacity: 0.5; font-size: 0.875rem;">No history yet</div>';
        return;
      }
      
      historyList.innerHTML = history.map((item, i) => `
        <div class="history-item" style="padding: 12px; background: rgba(255,255,255,0.5); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 0.875rem;">
          <div style="font-weight: 600; margin-bottom: 4px;">${item.name}</div>
          <div style="opacity: 0.7; font-size: 0.8125rem;">${new Date(item.timestamp).toLocaleTimeString()}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
